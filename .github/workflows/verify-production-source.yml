name: Verify RezNet production source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-production-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify source and refresh checksums
        shell: bash
        run: |
          set -euo pipefail
          node --check site/assets/js/reznet.js
          grep -q '"Authorization": token' site/assets/js/reznet.js
          ! grep -q 'Nothing was charged' site/assets/js/reznet.js
          grep -q 'hello@reznetllc.com' site/index.html
          grep -q '336-347-8466' site/index.html
          find site -type f -print0 | sort -z | xargs -0 sha256sum > PRODUCTION_SHA256SUMS.txt

      - name: Commit refreshed manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'RezNet Production Verify'
          git config user.email 'bradon@reznetllc.com'
          git add PRODUCTION_SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo 'Checksum manifest already current.'
            exit 0
          fi
          git commit -m 'Refresh production source checksums after form auth fix'
          git push origin HEAD:main
