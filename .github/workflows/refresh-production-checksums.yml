name: Refresh RezNet production checksums

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-production-checksums.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and refresh manifest
        shell: bash
        run: |
          set -euo pipefail
          node --check site/assets/js/reznet.js
          grep -q 'normalizeUsPhone(data.get("phone"))' site/assets/js/reznet.js
          grep -q '"Authorization": token' site/assets/js/reznet.js
          ! grep -q 'Nothing was charged' site/assets/js/reznet.js
          find site -type f -print0 | sort -z | xargs -0 sha256sum > PRODUCTION_SHA256SUMS.txt

      - name: Commit manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'RezNet Production Verify'
          git config user.email 'bradon@reznetllc.com'
          git add PRODUCTION_SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo 'Checksum manifest already current.'
            exit 0
          fi
          git commit -m 'Refresh production checksums after phone normalization fix'
          git push origin HEAD:main
